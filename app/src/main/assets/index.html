<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Aero</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one-column phone app. A departure-board hero (amber flaps on board black) answers
   "when do I leave"; boarding-pass cards with a perforated stub carry the flight details
   on a cool apron-grey ground. Amber is reserved for the leave time. */
:root{
  --ground:#E7EBF0; --paper:#FFFFFF; --paper-2:#F3F5F8; --ink:#132033; --ink-2:#4A596C; --ink-3:#768395; --rule:#D0D8E1;
  --amber:#F2AE00; --amber-ink:#7E5300; --amber-soft:#FFF1C9;
  --route:#2459C2; --route-soft:#E2EAFA;
  --ok:#17804F; --ok-soft:#DFF2E7; --warn:#9E5E00; --warn-soft:#FCEDD2; --bad:#B9312A; --bad-soft:#FAE1DE;
  --board:#16202B; --board-2:#0E161F; --board-ink:#FFC62E; --board-text:#E9EEF4; --board-dim:#8E9BAA; --board-rule:#2A3644;
  --shadow:0 1px 2px rgb(19 32 51 / .06), 0 8px 22px rgb(19 32 51 / .07);
  --on-amber:#1A1405; --scrim:rgb(8 13 19 / .55);
  --f-display:"Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --f-body:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0B121A; --paper:#141E29; --paper-2:#192532; --ink:#E5EBF2; --ink-2:#A7B3C1; --ink-3:#7E8B9A; --rule:#273443;
    --amber:#FFC21A; --amber-ink:#FFD45C; --amber-soft:#382C0C;
    --route:#7AA8FF; --route-soft:#17263E;
    --ok:#4FC48C; --ok-soft:#12301F; --warn:#F1A848; --warn-soft:#352610; --bad:#FF7A6C; --bad-soft:#3A1916;
    --board:#0F1821; --board-2:#080D13; --board-ink:#FFC62E; --board-text:#E9EEF4; --board-dim:#8492A2; --board-rule:#243140;
    --shadow:0 1px 2px rgb(0 0 0 / .3), 0 8px 22px rgb(0 0 0 / .25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0B121A; --paper:#141E29; --paper-2:#192532; --ink:#E5EBF2; --ink-2:#A7B3C1; --ink-3:#7E8B9A; --rule:#273443;
  --amber:#FFC21A; --amber-ink:#FFD45C; --amber-soft:#382C0C;
  --route:#7AA8FF; --route-soft:#17263E;
  --ok:#4FC48C; --ok-soft:#12301F; --warn:#F1A848; --warn-soft:#352610; --bad:#FF7A6C; --bad-soft:#3A1916;
  --board:#0F1821; --board-2:#080D13; --board-ink:#FFC62E; --board-text:#E9EEF4; --board-dim:#8492A2; --board-rule:#243140;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 8px 22px rgb(0 0 0 / .25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ground)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ground)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--route)}
:focus-visible{outline:2px solid var(--route);outline-offset:2px;border-radius:6px}
.in,.wrap{width:100%;max-width:600px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--ground)}
header.top .in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.trips-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.trips-btn b{font-family:var(--f-mono);color:var(--ink)}

main.wrap{display:flex;flex-direction:column;gap:14px;padding-block:4px calc(112px + env(safe-area-inset-bottom,0px))}

.note-bar{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--amber-soft);color:var(--amber-ink);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600}
.note-bar span{min-width:0}

/* departure board hero */
.board{background:var(--board);color:var(--board-text);border-radius:20px;padding:18px 16px 16px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.board-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--board-dim)}
.board-date{font-size:14px;font-weight:600;color:var(--board-text)}
.flaps{perspective:420px;display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:600;font-size:clamp(64px,22vw,96px);line-height:1}
.flap{position:relative;display:inline-grid;place-items:center;width:.74em;height:1.08em;background:var(--board-2);color:var(--board-ink);border-radius:8px;box-shadow:inset 0 -2px 0 rgb(0 0 0 / .35)}
.flap::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:var(--board)}
.flaps.flip .flap{animation:flip .4s cubic-bezier(.3,.7,.4,1) calc(140ms + var(--i) * 85ms) 1 none}
@keyframes flip{0%{transform:rotateX(-80deg);filter:brightness(1.6)}100%{transform:none;filter:none}}
.flap-sep{color:var(--board-ink);width:.28em;text-align:center;transform:translateY(-.04em)}
.board-sub{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:14px;color:var(--board-text)}
.board-sub .cd{color:var(--board-ink);font-weight:700}
.board-rows{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.board-row{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;background:var(--board-2);border:1px solid var(--board-rule);border-radius:12px;padding:10px 12px;color:var(--board-text);min-width:0}
.board-row .k{font-size:12px;color:var(--board-dim);font-weight:600}
.board-row .v{font-family:var(--f-display);font-size:24px;font-weight:600;line-height:1.1;letter-spacing:.01em}
.board-row .h{font-size:12px;color:var(--board-dim)}
.board-row[aria-expanded="true"]{border-color:var(--board-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--board-rule);background:transparent;color:var(--board-text);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--board-ink);border-color:var(--board-ink);color:var(--board-2)}
.chip-hint{font-size:12px;color:var(--board-dim);width:100%}
.board-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:12px 14px;font-weight:700;font-size:15px;text-decoration:none;border:0;min-height:46px}
.btn-amber{background:var(--board-ink);color:var(--on-amber);flex:1 1 auto}
.btn-board{background:transparent;color:var(--board-text);border:1px solid var(--board-rule);flex:0 0 auto}
.tz-note{font-size:12px;color:var(--board-dim);margin:0}
.need-time{display:flex;flex-direction:column;gap:10px}
.need-time p{margin:0;color:var(--board-text)}
.need-time .row{display:flex;gap:8px;flex-wrap:wrap}
.need-time input{background:var(--board-2);border:1px solid var(--board-rule);color:var(--board-text);border-radius:10px;padding:10px 12px;min-height:46px;font-family:var(--f-mono)}

/* cards */
.card{background:var(--paper);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.card h2,.sec-title{margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:.06em;color:var(--ink-3)}
.sec-title{margin:6px 2px -4px}

/* timeline */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:62px 18px 1fr;gap:0 8px;align-items:start;min-height:46px}
.tl time{font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1.15;color:var(--ink)}
.tl time small{display:block;font-family:var(--f-body);font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:0}
.tl .dot{position:relative;height:100%;display:flex;justify-content:center}
.tl .dot::before{content:"";width:10px;height:10px;border-radius:50%;border:2px solid var(--ink-3);background:var(--paper);margin-top:7px;z-index:1}
.tl .dot::after{content:"";position:absolute;top:19px;bottom:-7px;width:2px;background:var(--rule)}
.tl li:last-child .dot::after{display:none}
.tl li.go .dot::before{background:var(--amber);border-color:var(--amber)}
.tl li.dep .dot::before{background:var(--ink);border-color:var(--ink)}
.tl .what{padding-bottom:10px;min-width:0}
.tl .what b{display:block;font-size:15px}
.tl .what span{display:block;font-size:13px;color:var(--ink-2)}

/* boarding pass */
.pass{background:var(--paper);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.pass-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px 0}
.al{display:flex;align-items:center;gap:8px;min-width:0}
.al-code{flex:none;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--route-soft);color:var(--route);font-family:var(--f-mono);font-weight:600;font-size:12px}
.al-name{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fno{font-family:var(--f-mono);font-weight:600;font-size:14px;color:var(--ink-2);white-space:nowrap}
.pass-route{display:grid;grid-template-columns:1fr minmax(64px,auto) 1fr;gap:8px;align-items:start;padding:10px 16px 16px}
.end{min-width:0}
.end.r{text-align:right}
.code{font-family:var(--f-display);font-weight:700;font-size:46px;line-height:1;letter-spacing:.01em}
.end .t{font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1.2}
.end .t.missing{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--warn)}
.end .t.est{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--ink-3)}
.end .nm{font-size:13px;font-weight:700;color:var(--ink);overflow-wrap:anywhere}
.end .dt{font-size:12px;color:var(--ink-3)}
.mid{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:12px;color:var(--ink-3)}
.mid .line{position:relative;width:100%;min-width:64px;height:20px;display:grid;place-items:center}
.mid .line::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dashed var(--rule)}
.mid svg{position:relative;background:var(--paper);padding:0 3px;color:var(--ink-2)}
.mid .dur{font-size:12px;font-weight:600;white-space:nowrap}
.stub{position:relative;background:var(--paper-2);border-top:2px dashed var(--rule);padding:12px 16px 12px}
.stub::before,.stub::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--ground)}
.stub::before{left:-10px}.stub::after{right:-10px}
.fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0}
.fields div{min-width:0}
.fields dt{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--ink-3)}
.fields dd{margin:0;font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.fields dd small{display:block;font-family:var(--f-body);font-size:10px;font-weight:600;color:var(--ink-3);line-height:1.3}
.fields dd.none{color:var(--ink-3)}
.stub-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;margin-top:10px;font-size:12px;color:var(--ink-3)}
.stub-foot b{font-family:var(--f-mono);color:var(--ink-2);font-weight:600}
.stub-foot .acts{display:flex;gap:12px;align-items:center}
.txt-btn{background:none;border:0;padding:4px 0;color:var(--route);font-weight:700;font-size:12px;text-decoration:none}

/* transfer */
.xfer{display:grid;grid-template-columns:28px 1fr;gap:10px;margin:-4px 0}
.xfer-rail{display:flex;justify-content:center}
.xfer-rail::before{content:"";width:0;border-left:3px dotted var(--rule);height:100%}
.xfer-body{background:var(--paper);border-radius:14px;padding:12px 14px;border:1px solid var(--rule);min-width:0;display:flex;flex-direction:column;gap:8px}
.xfer-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.xfer-top b{font-size:15px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.unknown{background:var(--paper-2);color:var(--ink-2)}
.xfer ol{margin:0;padding-left:18px;font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:3px}
.xfer p{margin:0;font-size:12px;color:var(--ink-3)}
.alert{border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600;background:var(--bad-soft);color:var(--bad)}
.alert.miss{display:flex;flex-direction:column;gap:6px;font-weight:500;line-height:1.5;margin:6px 0;border:1px solid var(--bad)}
.alert.miss b{font-weight:700}.alert.miss .sub{margin-top:4px}
.alert.miss ol{margin:0;padding-left:18px;color:var(--bad)}
.note-bar.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.trip-days{display:flex;flex-direction:column;gap:6px}
.trip-days .stay{display:flex;align-items:center;gap:8px;padding:2px 14px;color:var(--ink-2);font-size:13px}
.trip-days .stay::before{content:"";width:2px;height:18px;background:var(--rule);margin:0 8px 0 4px}
.trip-sum{font-size:13px;color:var(--ink-2);margin:-4px 0 10px}

/* other journeys */
.jlist{display:flex;flex-direction:column;gap:8px}
.jrow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:12px 14px}
.jrow .r{font-family:var(--f-display);font-weight:600;font-size:20px;white-space:nowrap}
.jrow .m{font-size:13px;color:var(--ink-2);min-width:0}
.jrow[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}

.empty{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.empty h2{margin:0;font-size:20px}
.empty p{margin:0;color:var(--ink-2)}
.empty-title{margin:0;font-size:22px;line-height:1.3;color:var(--board-text)}
.empty-sub{margin:0;color:var(--board-dim);font-size:14px}
.note-bar .txt-btn{color:var(--amber-ink);flex:none}
.foot-note{font-size:12px;color:var(--ink-3);padding:0 2px;margin:2px 0 0}

/* bottom bar */
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--paper);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar .btn{white-space:nowrap}
@media (max-width:360px){.bar .btn{padding-inline:12px;gap:6px;font-size:14px}}
nav.bar .in{display:flex;align-items:center;gap:8px;padding-block:10px}
.ver{font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--ink-3);margin-right:auto;white-space:nowrap}
.btn-primary{background:var(--ink);color:var(--paper)}
.btn-secondary{background:var(--paper-2);color:var(--ink);border:1px solid var(--rule)}

/* sheets */
.scrim{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:600px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding-top:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-head h2{margin:0;font-size:18px}
.x{background:var(--paper-2);border:0;border-radius:999px;width:36px;height:36px;display:grid;place-items:center;color:var(--ink-2)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;font-size:14px;color:var(--ink-3)}
.steps li .ic{width:22px;height:22px;border-radius:50%;border:2px solid var(--rule);display:grid;place-items:center;font-size:12px;font-weight:800}
.steps li.active{color:var(--ink)}
.steps li.active .ic{border-color:var(--amber);border-top-color:transparent;animation:spin .9s linear infinite}
.steps li.done{color:var(--ink)}
.steps li.done .ic{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.steps li.skip .ic{border-style:dashed}
.steps li small{display:block;color:var(--ink-3);font-size:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.thumb{width:100%;max-height:180px;object-fit:contain;border-radius:12px;background:var(--paper-2)}
.msg{margin:0;font-size:14px;color:var(--ink-2)}
.msg.err{color:var(--bad);font-weight:600}
.sheet-actions{display:flex;gap:8px;flex-wrap:wrap}
.sheet-actions .btn{flex:1 1 140px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--ink-3);min-width:0}
.form label.full{grid-column:1/-1}
.form input{border:1px solid var(--rule);background:var(--paper-2);border-radius:10px;padding:10px 12px;min-height:44px;font-size:15px;font-weight:600;color:var(--ink);width:100%;min-width:0}
.trip-row{display:flex;align-items:center;gap:8px}
.trip-row .jrow{flex:1;min-width:0}
.del{background:none;border:1px solid var(--rule);border-radius:12px;min-width:44px;height:44px;display:grid;place-items:center;color:var(--ink-3)}
.del.confirm{background:var(--bad);border-color:var(--bad);color:var(--paper);padding:0 10px;font-size:13px;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:12px;font-size:14px;font-weight:600;max-width:min(92vw,520px);box-shadow:var(--shadow)}
#h5q{position:absolute;left:-10000px;top:0;width:640px;height:10px;overflow:hidden}
@media (max-width:380px){ .fields{grid-template-columns:repeat(2,minmax(0,1fr))} .code{font-size:40px} }
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }

/* v1.1 additions */
:root{--scan-bg:#FFFFFF;--scan-ink:#000000;--scan-2:#EEF1F4;--scan-rule:#C9D1DA;--scan-strong:#1B2633;--scan-text:#3A4655;--scan-dim:#5D6A79}
.top-acts{display:flex;align-items:center;gap:8px}
.icon-btn{position:relative;display:grid;place-items:center;width:38px;height:38px;border-radius:999px;border:1px solid var(--rule);background:var(--paper);color:var(--ink-2)}
.badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--amber);color:var(--on-amber);font-size:11px;font-weight:800;display:grid;place-items:center;font-family:var(--f-mono)}
.board-alert{display:flex;gap:8px;align-items:flex-start;background:var(--board-2);border:1px solid var(--board-ink);color:var(--board-ink);border-radius:12px;padding:9px 11px;font-size:13px;font-weight:700}
.board-more{display:flex;flex-wrap:wrap;gap:6px}
.mini{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--board-rule);background:transparent;color:var(--board-text);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:700;min-height:38px}
.mini b{color:var(--board-ink);font-family:var(--f-mono)}

.rt{background:var(--paper);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.rt-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rt-head b{font-size:14px}
.tag{display:inline-flex;align-items:center;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:800;background:var(--route-soft);color:var(--route);white-space:nowrap}
.tag.ex{background:var(--amber-soft);color:var(--amber-ink)}
.rt p{margin:0;font-size:13px;color:var(--ink-2)}
.rt-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0}
.rt-grid div{min-width:0}
.rt-grid dt{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--ink-3)}
.rt-grid dd{margin:0;font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.rt-grid dd.st{font-family:var(--f-body);font-size:15px;font-weight:800;color:var(--ok);line-height:1.9}

.dest{display:flex;flex-direction:column;gap:12px}
.dest-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dest-top .where{display:flex;flex-direction:column;min-width:0}
.dest-top .where small{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--ink-3)}
.dest-top .where b{font-size:20px;line-height:1.3;overflow-wrap:anywhere}
.dest-top .where span{font-size:13px;color:var(--ink-2)}
.wx{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.wx .t{font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1.1}
.wx .d{font-size:12px;color:var(--ink-2)}
.wx .note{font-size:11px;color:var(--ink-3);max-width:120px}
.dest-sub{margin:0;font-size:13px;color:var(--ink-2)}
.dest-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;border:1px solid var(--rule);background:var(--paper-2);border-radius:12px;padding:11px 12px;font-size:14px;font-weight:700;color:var(--ink);min-height:48px;min-width:0}
.row-btn b{font-family:var(--f-mono);font-size:13px;color:var(--route)}
.row-btn.full{grid-column:1/-1}

.seats-line{margin-top:8px;font-size:12px;color:var(--ink-2)}
.seats-line b{font-family:var(--f-mono);font-weight:600;color:var(--ink)}

/* full-screen overlays */
.overlay{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;overflow:auto;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.overlay.scan-surface{background:var(--scan-bg);color:var(--scan-ink)}
.overlay.taxi{background:var(--paper);color:var(--ink)}
.ov-head{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:600px;width:100%;margin:0 auto}
.ov-head b{font-size:17px}
.scan-surface .x{background:var(--scan-2);color:var(--scan-strong)}
.ov-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;max-width:600px;width:100%;margin:0 auto;padding-block:12px}
.qr{width:min(84vw,360px);height:auto;max-width:100%}
.qr rect{fill:var(--scan-bg)} .qr path{fill:var(--scan-ink)}
.pass-photo{max-width:100%;max-height:62vh;object-fit:contain;border-radius:8px}
.ov-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.ov-chip{border:1px solid var(--scan-rule);background:var(--scan-bg);color:var(--scan-strong);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700}
.ov-chip[aria-pressed="true"]{background:var(--scan-strong);border-color:var(--scan-strong);color:var(--scan-bg)}
.ov-info{text-align:center;font-size:14px;color:var(--scan-text);margin:0}
.ov-info b{font-family:var(--f-mono);color:var(--scan-ink)}
.ov-note{text-align:center;font-size:12px;color:var(--scan-dim);margin:0}
.taxi-say{font-size:15px;font-weight:700;color:var(--ink-3);margin:0;text-align:center}
.taxi-local{font-size:clamp(34px,11vw,64px);font-weight:800;line-height:1.2;text-align:center;overflow-wrap:anywhere}
.taxi-term{font-family:var(--f-display);font-size:34px;font-weight:700;color:var(--route)}
.taxi-en{font-size:20px;font-weight:700;text-align:center}
.taxi-ko{font-size:15px;color:var(--ink-2);text-align:center}
.taxi-apps{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

/* sheets: alerts, checklist, share */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.alert-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1px solid var(--rule);border-radius:12px;padding:10px 12px}
.alert-row time{font-family:var(--f-display);font-size:20px;font-weight:600;line-height:1.1;text-align:center;min-width:56px}
.alert-row time small{display:block;font-family:var(--f-body);font-size:11px;font-weight:700;color:var(--ink-3)}
.alert-row .txt{min-width:0}
.alert-row .txt b{display:block;font-size:14px}
.alert-row .txt span{display:block;font-size:12px;color:var(--ink-2)}
.alert-row.off{opacity:.5}
.sw{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:999px;background:var(--rule);position:relative;cursor:pointer;flex:none;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--paper);transition:transform .15s}
.sw:checked{background:var(--ok)}
.sw:checked::after{transform:translateX(18px)}
.sub-h{margin:4px 0 0;font-size:13px;font-weight:800;letter-spacing:.06em;color:var(--ink-3)}
.widget-mock{align-self:flex-start;width:min(100%,300px);background:var(--board);color:var(--board-text);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.widget-mock small{font-size:11px;font-weight:700;color:var(--board-dim)}
.widget-mock .t{font-family:var(--f-display);font-size:40px;font-weight:600;color:var(--board-ink);line-height:1.05}
.widget-mock span{font-size:13px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.checks li{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--rule)}
.checks li:last-child{border-bottom:0}
.checks input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--ok)}
.checks label{display:flex;flex-direction:column;gap:2px;font-size:14px;font-weight:700;min-width:0;cursor:pointer}
.checks label span{font-size:12px;font-weight:600;color:var(--ink-2)}
.checks a{font-size:12px;font-weight:700}
.pp{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--paper-2);border-radius:12px;padding:10px 12px}
.pp label{font-size:13px;font-weight:700;color:var(--ink-2)}
.pp input{border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:8px 10px;min-height:40px;color:var(--ink)}
.pp .st{font-size:13px;font-weight:700;width:100%}
.pp .st.ok{color:var(--ok)} .pp .st.bad{color:var(--bad)}
.share-text{white-space:pre-wrap;word-break:break-word;background:var(--paper-2);border:1px solid var(--rule);border-radius:12px;padding:12px;font-size:14px;margin:0;font-family:var(--f-body);user-select:text}
.drop-hint{position:fixed;inset:0;z-index:40;background:var(--scrim);display:grid;place-items:center;color:var(--board-text);font-size:20px;font-weight:800;pointer-events:none}
</style>
</head><body>

/* ---------- small image store (boarding pass photos stay on this phone) ---------- */
const idb = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => { try { const r = indexedDB.open('chalkak', 1); r.onupgradeneeded = () => r.result.createObjectStore('img'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch(e){ rej(e); } }));
  const run = (mode, fn) => open().then(db => new Promise((res, rej) => { const tx = db.transaction('img', mode); const req = fn(tx.objectStore('img')); tx.oncomplete = () => res(req ? req.result : undefined); tx.onerror = () => rej(tx.error); }));
  return {
    put: (k, v) => run('readwrite', s => s.put(v, k)).catch(() => null),
    get: k => run('readonly', s => s.get(k)).catch(() => null),
    del: k => run('readwrite', s => s.delete(k)).catch(() => null)
  };
})();

function load(){ try { const d = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); if (d && Array.isArray(d.trips)) { state.trips = d.trips; state.current = d.current; state.alertsOff = d.alertsOff || {}; state.passport = d.passport || null; state.icnKey = d.icnKey || ''; } } catch(e){} }
function save(){ try { localStorage.setItem(STORE_KEY, JSON.stringify({trips: state.trips, current: state.current, alertsOff: state.alertsOff, passport: state.passport, icnKey: state.icnKey})); } catch(e){} syncNative(); }
const uid = () => Math.random().toString(36).slice(2, 10);
function syncNative(){
  if (!NATIVE) return;
  try {
    if (NATIVE.scheduleAlerts) NATIVE.scheduleAlerts(JSON.stringify(state.trips.flatMap(alertsFor).filter(a => !state.alertsOff[a.type]).map(a => ({id: a.id, at: a.at, title: a.title, body: a.body}))));

}

/* 여행 전체 일정: 가는 편·오는 편을 날짜 순서로, 사이에 현지에서 며칠 묵는지 */
function nightsBetween(endMs, startMs, tz){ if (endMs == null || startMs == null) return null; const a = dayKey(endMs, tz), b = dayKey(startMs, tz); return Math.round((Date.parse(b) - Date.parse(a)) / 864e5); }
function tripDaysView(js, ji){
  const first = js[0][0], lastJ = js[js.length - 1], last = lastJ[lastJ.length - 1];
  const endMs = last.arrMs ?? last.arrEst ?? last.depMs, endTz = (apt(last.to) || {}).tz || DEVICE_TZ;
  let sum = '';
  if (first.depMs != null && endMs != null) {
    const tz0 = (apt(first.from) || {}).tz || DEVICE_TZ, days = Math.round((Date.parse(dayKey(endMs, endTz)) - Date.parse(dayKey(first.depMs, tz0))) / 864e5);
    sum = `${fmtDate(first.depMs, tz0)} ~ ${fmtDate(endMs, endTz)}${days > 0 ? ` · ${days}박 ${days + 1}일` : ''}`;
  }
  const rows = [];
  js.forEach((x, k) => {
    if (k) {
      const p = js[k - 1][js[k - 1].length - 1], tz = (apt(p.to) || {}).tz || DEVICE_TZ;
      const n = nightsBetween(p.arrMs ?? p.arrEst, x[0].depMs, tz);
      rows.push(`<div class="stay">${esc(aptKo(p.to))}${n != null ? (n > 0 ? `에서 ${n}박` : '에서 당일') : '에서 머물러요'}</div>`);
    }
    const tz = (apt(x[0].from) || {}).tz || DEVICE_TZ;
    const when = x[0].depMs != null ? `${fmtDate(x[0].depMs, tz)} ${fmtTime(x[0].depMs, tz)}` : (x[0].date ? fmtDateStr(x[0].date) : '날짜 미확인');
    const route = [x[0].from, ...x.map(l => l.to)].join(' → ');
    rows.push(`<button class="jrow" type="button" data-act="focus" data-j="${k}" aria-current="${k === ji}"><span class="m"><b>${k === 0 ? '가는 편' : k === js.length - 1 && last.to === first.from ? '오는 편' : (k + 1) + '번째 이동'}</b> · ${esc(when)}<br>${esc(x.map(l => l.airline + ' ' + l.flight).join(', '))}${x.length > 1 ? ` · 환승 ${x.length - 1}번` : ''}</span><span class="r">${esc(route)}</span></button>`);
  });
  return `<h2 class="sec-title">여행 전체 일정</h2>${sum ? `<p class="trip-sum">${esc(sum)}</p>` : ''}<div class="trip-days">${rows.join('')}</div>`;
}
function transferView(a, b){
  const x = transferInfo(a, b), at = aptKo(a.to);
  const label = {ok: '여유 있어요', warn: '서두르면 충분해요', bad: '빠듯해요', unknown: '시각 확인 필요'}[x.level];
  const gapTxt = x.gap != null ? `${x.est ? '약 ' : ''}${fmtDur(x.gap)}` : '';
  let steps, note = '';
  if (x.changeAirport) {
    steps = [
      `${esc(at)}에 내려 입국 심사를 받고 짐을 찾아요`,
      `${esc(aptKo(b.from))}공항으로 이동해요 · 구글 지도에서 환승역을 확인하세요`,
      `${esc(aptKo(b.from))}에서 ${esc(b.airline)} ${esc(b.flight)} 체크인을 다시 해요 (보통 출발 1시간 전 마감)`
    ];
  } else {
    steps = [
      `내리면 '환승 · Transfer' 표지판을 따라가요`,
      `환승 보안검색을 받아요 (액체류 100ml 규칙 다시 적용)`,
      `전광판에서 ${esc(b.airline)} ${esc(b.flight)} 탑승구를 확인해요`,
      b.depMs != null ? `탑승구 마감은 보통 출발 15~20분 전이에요 (${esc(fmtTime(b.depMs - 20 * 60000, (apt(b.from) || {}).tz || DEVICE_TZ))}쯤)` : `탑승구 마감은 보통 출발 15~20분 전이에요`
    ];
    if (x.icn) steps.splice(1, 0, `제${x.icn[0]}터미널 → 제${x.icn[1]}터미널로 이동해야 해요 (셔틀로 15~20분)`);
    note = '한 번에 예약한 항공권이면 짐은 보통 최종 목적지까지 가요. 따로 산 항공권이면 짐을 찾아 다시 체크인해야 해요.';
  }
  const link = x.changeAirport
    ? `<a class="txt-btn" href="${esc(mapsDir(aptQuery(b.from), aptQuery(a.to)))}" target="_blank" rel="noopener">${esc(at)} → ${esc(aptKo(b.from))} 길찾기 ↗</a>`
    : `<a class="txt-btn" href="${esc(mapsSearch(aptQuery(a.to)))}" target="_blank" rel="noopener">구글 지도에서 ${esc(at)}공항 보기 ↗</a>`;
  return `<div class="xfer"><div class="xfer-rail" aria-hidden="true"></div><div class="xfer-body">
    <div class="xfer-top"><b>${esc(at)}에서 ${x.changeAirport ? '공항 이동 환승' : '환승'}</b><span class="pill ${x.level}">${gapTxt ? esc(gapTxt) + ' · ' : ''}${label}</span></div>
    ${x.changeAirport ? `<div class="alert">도착 공항(${esc(a.to)})과 다음 출발 공항(${esc(b.from)})이 달라요</div>` : ''}
    ${x.level === 'bad' ? `<div class="alert miss"><b>환승 시간이 짧아요${gapTxt ? ` (${esc(gapTxt)})` : ''}</b>
      <span>비행기에서 승무원에게 "환승이 빠듯해요(Tight connection)"라고 말하면 먼저 내리게 도와주기도 해요.</span>
      <b class="sub">다음 편을 놓치면</b>
      <ol><li>환승 구역의 <b>${esc(airlineName(b.airline) || b.airline)} 환승 카운터(Transfer Desk)</b>로 바로 가요</li>
      <li>한 번에 예약한 항공권이면 보통 항공사가 다음 편으로 <b>무료로</b> 바꿔 줘요. 늦게 도착한 편 때문이라면 식사·숙박도 물어보세요</li>
      <li>따로 산 항공권이면 다음 편을 새로 사야 할 수 있어요. 예약한 곳(여행사·항공사)에 먼저 연락해요</li>
      <li>바뀐 편명을 Aero에 다시 넣으면 나갈 시각·알림이 새로 맞춰져요</li></ol></div>` : ''}
    <ol>${steps.map(s => `<li>${s}</li>`).join('')}</ol>
    ${note ? `<p>${note}</p>` : ''}
    ${link}
  </div></div>`;
}

function render(){
  const t = currentTrip(), main = $('#main');
  $('#trip-count').textContent = state.trips.length;
  const n = allAlerts().length, badge = $('#alert-count'); badge.textContent = n; badge.hidden = !n;
  if (!t) { main.innerHTML = emptyView(); return; }
  const {js, ji, j} = journeysOf(t), plan = planFor(t, j);
  const parts = [];
  if (t.example) parts.push(`<div class="note-bar"><span>예시 화면이에요. 실제 저장된 항공권이 아니에요.</span><button class="txt-btn" type="button" data-act="example-off">예시 닫기</button></div>`);
  { const tight = j.findIndex((l, k) => k && transferInfo(j[k - 1], l).level === 'bad');
    if (tight > 0) parts.push(`<div class="note-bar bad"><span><b>${esc(aptKo(j[tight].from))} 환승 시간이 짧아요.</b> 아래 환승 안내에서 놓쳤을 때 할 일을 확인하세요.</span></div>`); }
  parts.push(heroView(t, j, plan));
  parts.push(realtimeView(t, j));
  parts.push(timelineView(j, plan));
  parts.push(destView(t, j));
  parts.push(`<h2 class="sec-title">항공편${j.length > 1 ? ` · ${j.length}구간` : ''}</h2>`);
  j.forEach((l, k) => { if (k) parts.push(transferView(j[k - 1], l)); parts.push(passView(l, !t.example)); });
  if (js.length > 1) {
    parts.push(tripDaysView(js, ji));
  }
  parts.push(`<p class="foot-note">항공사·공항 사정에 따라 시각이 바뀔 수 있어요. 출발 전 실시간 운항 정보를 한 번 더 확인하세요.</p>`);
  main.innerHTML = parts.join('');
  const flapStr = plan ? fmtTime(plan.leaveMs, plan.tz) + t.id : '';
  if (flapStr && flapStr !== lastFlap) { lastFlap = flapStr; const fl = main.querySelector('.flaps'); if (fl) fl.classList.add('flip'); }
}

let toastTimer = null, wakeLock = null, objUrls = [];
function toast(msg){
  let el = $('#toast'); if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 3200);
}
function openSheet(html, label){
  closeSheet();
  $('#layer').innerHTML = `<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(label)}">${html}</div></div>`;
  const first = $('#layer').querySelector('input:not([type=checkbox]), button:not(.x)'); if (first) first.focus({preventScroll: true});
}
function openOverlay(cls, html, label){
  closeSheet();
  $('#layer').innerHTML = `<div class="overlay ${cls}" role="dialog" aria-modal="true" aria-label="${esc(label)}">${html}</div>`;
}
function closeSheet(){
  $('#layer').innerHTML = '';
  objUrls.forEach(u => URL.revokeObjectURL(u)); objUrls = [];
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  if (NATIVE && NATIVE.setBrightness) try { NATIVE.setBrightness(-1); } catch(e){}
}

function checklistSheet(){
  const t = currentTrip(), {j} = journeysOf(t), ck = checklistFor(t, j);
  if (!ck) return;
  const check = t.check || {};
  const first = j[0], depDate = first.date;
  let ppStatus = '';
  if (state.passport && depDate) {
    const limit = addDays(depDate, 183), ok = state.passport >= limit;
    ppStatus = `<span class="st ${ok ? 'ok' : 'bad'}">${ok ? '출발일 기준 6개월 넘게 남았어요' : '출발일 기준 6개월이 안 남았어요. 입국이 거절될 수 있어요'}</span>`;
  }
  const items = ck.items.map(x => `<li><input type="checkbox" id="ck-${esc(x.id)}" data-check="${esc(x.id)}" ${check[x.id] ? 'checked' : ''}><label for="ck-${esc(x.id)}">${esc(x.text)}${x.sub ? `<span>${esc(x.sub)}</span>` : ''}${x.link ? `<a href="${esc(x.link)}" target="_blank" rel="noopener">공식 사이트 ↗</a>` : ''}</label></li>`).join('');
  openSheet(`<div class="sheet-head"><h2>입국 준비 · ${esc(regionKo(ck.cc))}</h2>${X_BTN}</div>
    <p class="msg">대한민국 여권 기준 · ${esc('2026년 10월 31일')} 확인 · 규정은 바뀔 수 있으니 출발 전 공식 사이트에서 한 번 더 확인하세요.</p>
    <ul class="checks">${items}</ul>
    <div class="pp"><label for="pp-exp">여권 만료일</label><input id="pp-exp" type="date" value="${esc(state.passport || '')}">${ppStatus}</div>
    <a class="txt-btn" href="https://www.0404.go.kr/" target="_blank" rel="noopener">외교부 해외안전여행에서 자세히 보기 ↗</a>`, '입국 준비');
}

let passIdx = 0, passMode = null;
async function passOverlay(){
  const t = currentTrip(), {j} = journeysOf(t), list = passesFor(t, j);
  if (!list.length) return;
  if (passIdx >= list.length) passIdx = 0;
  const p = list[passIdx];
  const mode = passMode || ((p.raw && (p.fmt === 'qr_code' || !p.img)) ? 'code' : 'photo');
  const legs = t.legs.filter(l => p.legs.includes(legKey(l)));
  const info = legs.map(l => `${esc(l.airline)} ${esc(l.flight)} ${esc(l.from)}→${esc(l.to)} <b>${esc((l.seats || {})[p.name] || l.seat || '')}</b>`).join(' · ');
  openOverlay('scan-surface', `<div class="ov-head"><b>탑승권</b>${X_BTN}</div>
    ${list.length > 1 ? `<div class="ov-chips">${list.map((x, i) => `<button class="ov-chip" type="button" data-act="pass-pick" data-i="${i}" aria-pressed="${i === passIdx}">${esc(x.name || '탑승객')}${list.filter(y => y.name === x.name).length > 1 ? ' · ' + esc(t.legs.find(l => x.legs.includes(legKey(l)))?.flight || '') : ''}</button>`).join('')}</div>` : ''}
    <div class="ov-body" id="pass-body">${mode === 'code' && p.raw ? QR.svg(p.raw) : '<p class="ov-note">사진을 불러오는 중…</p>'}
      <p class="ov-info">${esc(p.name || '')}<br>${info}</p>
      ${p.raw && p.img ? `<div class="ov-chips"><button class="ov-chip" type="button" data-act="pass-mode" data-m="code" aria-pressed="${mode === 'code'}">${p.fmt === 'qr_code' ? '바코드' : '선명한 QR'}</button><button class="ov-chip" type="button" data-act="pass-mode" data-m="photo" aria-pressed="${mode === 'photo'}">원본 사진</button></div>` : ''}
      <p class="ov-note">${NATIVE ? '화면이 최대 밝기로 바뀌었어요.' : '화면 밝기를 올리면 더 잘 읽혀요. 앱에서는 자동으로 최대 밝기가 돼요.'}${p.raw && p.fmt && p.fmt !== 'qr_code' ? ' 선명한 QR이 안 읽히면 원본 사진을 보여주세요.' : ''}</p>
    </div>`, '탑승권');
  try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch(e){}
  if (NATIVE && NATIVE.setBrightness) try { NATIVE.setBrightness(1); } catch(e){}
  if (mode === 'photo' && p.img) {
    const blob = await idb.get(p.img), body = $('#pass-body');
    if (!body) return;
    const first = body.firstElementChild;
    if (blob) { const u = URL.createObjectURL(blob); objUrls.push(u); const img = document.createElement('img'); img.className = 'pass-photo'; img.alt = '탑승권 원본 사진'; img.src = u; first.replaceWith(img); }
    else if (p.raw) first.outerHTML = QR.svg(p.raw);
    else first.textContent = '사진을 찾지 못했어요';
  }
}

function legForm(l){

function upsertTrip(legs, passenger, passInfo){
  const name = normName(passenger);
  const same = (a, b) => a.airline === b.airline && a.flight === b.flight && a.date === b.date;
  for (const b of legs) { b.seats = {}; if (b.seat) b.seats[name || '탑승객'] = b.seat; }
  let t = state.trips.find(x => x.legs.some(a => legs.some(b => same(a, b))));
  /* 같은 편이 없으면, 이어지는 환승 구간(앞 편 도착 공항에서 24시간 안에 출발)이 있는 여정에 묶는다.
     구간마다 탑승권을 따로 찍거나 직접 넣어도 한 여정의 환승으로 보이게 */
  const follows = (x, y) => {
    if (!x.to || x.to !== y.from) return false;
    const X = resolveLeg(x, 0), Y = resolveLeg(y, 0), xa = X.arrMs != null ? X.arrMs : X.arrEst;
    if (xa != null && Y.depMs != null) { const gap = Y.depMs - xa; return gap > -2 * 3600000 && gap < 24 * 3600000; }
    return !!(x.date && y.date) && Math.abs(Date.parse(y.date) - Date.parse(x.date)) <= 864e5;
  };
  if (!t) t = state.trips.find(x => x.legs.some(a => legs.some(b => follows(a, b) || follows(b, a))));
  /* 이어지는 편이 없으면, 도착한 곳에서 45일 안에 다시 떠나는 편(귀국편·다음 도시)도 같은 여행으로 묶는다 */
  const later = (x, y) => {
    if (!x.to || x.to !== y.from) return false;
    const X = resolveLeg(x, 0), Y = resolveLeg(y, 0), xa = X.arrMs != null ? X.arrMs : X.arrEst;
    if (xa != null && Y.depMs != null) { const gap = Y.depMs - xa; return gap > 0 && gap < 45 * 864e5; }
    return !!(x.date && y.date) && Date.parse(y.date) >= Date.parse(x.date) && Date.parse(y.date) - Date.parse(x.date) < 45 * 864e5;
  };
  /* 한국 공항으로 돌아온 뒤 다시 떠나는 건 다른 여행이에요 (현지에서 이어질 때만 묶음) */
  const KR = new Set(['ICN', 'GMP', 'PUS', 'CJU', 'TAE', 'CJJ', 'KWJ', 'MWX', 'YNY', 'RSU', 'USN', 'KPO', 'HIN', 'WJU', 'KUV']);
  if (!t) t = state.trips.find(x => x.legs.some(a => legs.some(b => (later(a, b) && !KR.has(a.to)) || (later(b, a) && !KR.has(a.from)))));
  if (t) {
    const main = (t.names || [])[0] || '';
    for (const b of legs) {
      const a = t.legs.find(x => same(x, b));
      if (a) {
        for (const k of Object.keys(b)) if (k !== 'seats' && k !== 'seat' && b[k] != null && b[k] !== '') a[k] = b[k];
        a.seats = Object.assign({}, a.seats || {}, b.seats);
        if (b.seat && (!a.seat || !name || name === main)) a.seat = b.seat;
      } else t.legs.push(b);
    }
    if (name && !(t.names || []).includes(name)) (t.names = t.names || []).push(name);
  } else {
    t = {id: uid(), created: Date.now(), legs, names: name ? [name] : [], s: {}, check: {}, passes: []};
    state.trips.unshift(t);
  }
  if (passInfo && (passInfo.raw || passInfo.img)) {
    t.passes = t.passes || [];
    const keys = legs.map(legKey);
    const entry = {id: uid(), name, raw: passInfo.raw || null, fmt: passInfo.fmt || null, img: passInfo.img || null, legs: keys};
    const dup = t.passes.findIndex(p => p.name === name && ((p.raw && p.raw === entry.raw) || p.legs.join() === keys.join()));
    if (dup >= 0) t.passes[dup] = entry; else t.passes.push(entry);
  }
  state.current = t.id; delete state.focus[t.id];
  save(); render();
  return t;
}

    'padding:10px max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));box-sizing:border-box}' +
    '.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:2px auto 14px}' +
    '.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}' +
    'h2{margin:6px 0 0;font-size:24px;font-weight:800;letter-spacing:-.01em}' +
    '.vtag{display:inline-block;margin-left:10px;padding:3px 10px;border-radius:999px;background:var(--pill);color:var(--pillInk);font:700 15px ui-monospace,Menlo,monospace;vertical-align:4px}' +
    '.vtag.up{background:rgba(245,180,0,.18);color:var(--yellow)}' +
    '.x{border:0;background:transparent;color:var(--ink2);font-size:30px;line-height:1;width:44px;height:44px;border-radius:12px;cursor:pointer}' +
    '.msg{margin:6px 0 14px;color:var(--ink2)}.msg b{color:var(--yellow)}' +
    '.row{display:flex;gap:8px;flex-wrap:wrap}' +
    '.btn{appearance:none;border:1px solid var(--line);background:var(--btn);color:var(--ink);border-radius:14px;padding:12px 18px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}' +
    '.btn.main{background:var(--yellow);border-color:var(--yellow);color:#1a1405}' +
    '.btn[disabled]{opacity:.6}' +
    '.lbl{margin:22px 0 4px;font-size:15px;font-weight:800;color:var(--ink2)}' +
    'ul.notes{list-style:none;margin:0;padding:0}' +
    'ul.notes>li{padding:12px 0;border-bottom:1px solid var(--line)}ul.notes>li:last-child{border-bottom:0}' +
    '.nh{display:flex;align-items:baseline;gap:10px}.nh b{font:800 16px ui-monospace,Menlo,monospace}.nh span{color:var(--ink3);font-size:14px}' +
    'ul.notes ul{margin:6px 0 0;padding-left:20px;list-style:circle;color:var(--ink2)}ul.notes ul li{margin:2px 0}' +
    '.hint{margin:0;color:var(--ink2)}' +
    'button:focus-visible,a:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}';
  var isOpen = false;
  function statusHTML() {
    if (!C.online) return '미리보기에서는 새 버전을 확인하지 않아요. 앱에서는 자동으로 확인해요.';
    if (checking) return '새 버전을 확인하는 중이에요…';
    if (hasUpdate()) return '새 버전 <b>v' + esc(norm(latest.v)) + '</b>이 나왔어요.';
    if (failed && !latest) return '새 버전을 확인하지 못했어요. 인터넷 연결을 확인해 주세요.';
    return latest ? '지금 쓰는 버전이 최신이에요.' : '새 버전 확인을 눌러 주세요.';
  }
  function render() {
    var up = hasUpdate();
    var notes = (C.notes || []).map(function (n) {
      var v = n.v === 'current' ? 'v' + cur() : n.v;
      return '<li><div class="nh"><b>' + esc(v) + '</b><span>' + esc(n.d || '') + '</span></div><ul>' +
        (n.items || []).map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></li>';
    }).join('');
    root.innerHTML = '<style>' + CSS + '</style><div class="w"><div class="scrim" data-x></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(C.name) + ' 앱 정보" tabindex="-1">' +
      '<div class="grab"></div><div class="head"><h2>' + esc(C.name) + '<span class="vtag' + (up ? ' up' : '') + '">v' + esc(cur()) + '</span></h2>' +
      '<button class="x" type="button" data-x aria-label="닫기">×</button></div>' +
      '<p class="msg">' + statusHTML() + '</p>' +
      '<div class="row">' + (up && latest.url ? '<a class="btn main" href="' + esc(latest.url) + '" target="_blank" rel="noopener">업데이트 받기</a>' : '') +
      (C.online ? '<button class="btn" type="button" data-chk' + (checking ? ' disabled' : '') + '>새 버전 확인</button>' : '') + '</div>' +
      '<p class="lbl">업데이트 내용</p><ul class="notes">' + notes + '</ul>' +
      '<p class="lbl">개인정보</p><p class="hint">' + esc(C.privacy || '') + '</p></div></div>';
    root.querySelectorAll('[data-x]').forEach(function (b) { b.addEventListener('click', close); });
    var c = root.querySelector('[data-chk]');
    if (c) c.addEventListener('click', function () { check(true); });
  }
  function open() { isOpen = true; host.style.display = 'block'; render(); var sh = root.querySelector('.sheet'); if (sh) sh.focus(); if (C.online && !checking && (!latest || Date.now() - (latest.at || 0) > 600000)) check(false); }
  function close() { isOpen = false; host.style.display = 'none'; root.innerHTML = ''; try { label.focus(); } catch (e) { /* 무시 */ } }
  document.addEventListener('keydown', function (e) { if (isOpen && e.key === 'Escape') close(); });
  /* 뒤로 가기 키: 창이 열려 있으면 창부터 닫음 (앱이 나중에 onBackKey를 바꿔도 유지) */
  var prevBack = window.onBackKey;
  Object.defineProperty(window, 'onBackKey', { configurable: true, get: function () { return wrapped; }, set: function (f) { prevBack = f; } });
  function wrapped() { if (isOpen) { close(); return true; } return typeof prevBack === 'function' ? prevBack.apply(this, arguments) : false; }

  function check(manual) {
    if (!C.online || checking) return;
    checking = true; failed = false; if (isOpen) render();
    var done = function () { checking = false; paint(); if (isOpen) render(); };
    fetch('https://api.github.com/repos/' + C.repo + '/releases/latest', { headers: { Accept: 'application/vnd.github+json' }, cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('http'); return r.json(); })
      .then(function (j) {
        var url = j.html_url || ('https://github.com/' + C.repo + '/releases/latest');
        (j.assets || []).forEach(function (a) { if (/\.apk$/i.test(a.name) && /^https:\/\/github\.com\//.test(a.browser_download_url)) url = a.browser_download_url; });
        if (j.tag_name) { latest = { v: norm(j.tag_name), url: url, at: Date.now() }; try { localStorage.setItem(KEY, JSON.stringify(latest)); } catch (e) { /* 무시 */ } }
        done();
      })
      .catch(function () { failed = true; done(); });
  }
  /* 폰(앱)이 확인한 최신 버전을 알려줄 때 */
  function native(v) { if (v) { latest = { v: norm(v), url: (latest && latest.url) || ('https://github.com/' + C.repo + '/releases/latest'), at: Date.now() }; try { localStorage.setItem(KEY, JSON.stringify(latest)); } catch (e) { /* 무시 */ } paint(); } }

  window.AppInfo = { open: open, check: check, native: native, refresh: paint };
  paint();
  if (C.online && (!latest || Date.now() - (latest.at || 0) > 6 * 3600000)) setTimeout(function () { check(false); }, 1500);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && C.online && latest && Date.now() - (latest.at || 0) > 6 * 3600000) check(false); });
})();
</script><!--/APPINFO-->
</body></html>
