# 다운로드·설명서 페이지만 다시 올리기 (앱은 다시 빌드하지 않음): site 폴더를 고치거나 직접 실행할 때
name: Aero 다운로드 페이지
on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# 앱 빌드와 페이지만 올리기가 동시에 돌면 페이지가 예전 버전으로 덮일 수 있어 차례로 실행
concurrency: { group: release, cancel-in-progress: false }
jobs:
  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 최신 버전 번호로 페이지 채우기
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          VER=$(gh release view --json tagName -q .tagName | sed 's/^v//')
          MB=$(gh release view --json assets -q '.assets[] | select(.name=="Aero.apk") | .size' | awk '{printf "%.1f", $1/1048576}')
          pip install -q qrcode==8.0 || true
          python3 -c "import qrcode,qrcode.image.svg as s;qrcode.make('https://dlsdml99-create.github.io/aero/dl.html',image_factory=s.SvgPathImage,border=1).save('site/qr.svg')" || true
          sed -i "s/__VER__/v$VER/g; s/__MB__/$MB/g" site/*.html
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=https://github.com/dlsdml99-create/aero/releases/latest/download/Aero.apk"><title>Aero 받기</title><a href="https://github.com/dlsdml99-create/aero/releases/latest/download/Aero.apk">Aero.apk 받기</a>' > site/dl.html
          touch site/.nojekyll
          VER="$VER" bash .github/webapp.sh
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with: { path: site }
  pages:
    needs: site
    runs-on: ubuntu-24.04
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
