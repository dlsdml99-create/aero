# [Aero용] build.yml - dlsdml99-create/aero 저장소 전용
name: Aero APK 만들기
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'site/**', '.github/**']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
# 앱 빌드와 페이지만 올리기가 동시에 돌면 페이지가 예전 버전으로 덮일 수 있어 차례로 실행
concurrency: { group: release, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 저장소 확인
        run: |
          if [ "${{ github.repository }}" != "dlsdml99-create/aero" ]; then
            echo "::error::이 build.yml은 Aero(aero) 저장소용이에요."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.7'
      - name: 버전 읽기
        run: |
          VER=$(grep -oE "const APP_VERSION = '[0-9.]+'" app/src/main/assets/index.html | grep -oE "[0-9.]+" | head -1)
          [ -n "$VER" ] || { echo "::error::index.html에서 버전을 찾지 못했어요"; exit 1; }
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "앱 버전: v$VER"
      - name: APK 만들기
        env:
          RUN_NUMBER: ${{ github.run_number }}
          VERSION_NAME: ${{ env.VER }}
          SIGNING: ${{ secrets.AERO_SIGNING }}
        run: |
          if [ -z "$SIGNING" ]; then
            echo "::error::서명 키 비밀값(AERO_SIGNING)이 없어요. 저장소 Settings → Secrets and variables → Actions → New repository secret 에 넣어 주세요."
            exit 1
          fi
          export KEY_PASS="${SIGNING%%:*}"
          echo "::add-mask::$KEY_PASS"
          export KEYSTORE="$RUNNER_TEMP/aero.jks"
          echo "${SIGNING#*:}" | base64 -d > "$KEYSTORE"
          gradle assembleRelease --no-daemon --stacktrace
          rm -f "$KEYSTORE"
          cp app/build/outputs/apk/release/app-release.apk Aero.apk
          ls -la Aero.apk
      - name: 릴리스 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MB=$(awk "BEGIN{printf \"%.1f\", $(stat -c%s Aero.apk)/1048576}")
          echo "MB=$MB" >> "$GITHUB_ENV"
          sed -i "s/__VER__/v$VER/g; s/__MB__/$MB/g" release-notes.md
          gh release delete "v$VER" --yes --cleanup-tag || true
          gh release create "v$VER" Aero.apk --latest --title "Aero v$VER" --notes-file release-notes.md
      - name: 다운로드 페이지
        run: |
          pip install -q qrcode==8.0 || true
          python3 -c "import qrcode,qrcode.image.svg as s;qrcode.make('https://dlsdml99-create.github.io/aero/dl.html',image_factory=s.SvgPathImage,border=1).save('site/qr.svg')" || true
          sed -i "s/__VER__/v$VER/g; s/__MB__/$MB/g" site/*.html
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=https://github.com/dlsdml99-create/aero/releases/latest/download/Aero.apk"><title>Aero 받기</title><a href="https://github.com/dlsdml99-create/aero/releases/latest/download/Aero.apk">Aero.apk 받기</a>' > site/dl.html
          touch site/.nojekyll
          bash .github/webapp.sh
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
  pages:
    needs: build
    runs-on: ubuntu-24.04
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
